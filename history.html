        <button id="prev-month" class="btn-icon" aria-label="Previous month">&lsaquo;</button>
        <h2 id="calendar-month-label"></h2>
        <button id="next-month" class="btn-icon" aria-label="Next month">&rsaquo;</button>
      </div>
      <div class="calendar-weekdays">
        <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
      </div>
      <div class="calendar-grid" id="calendar-grid">
        <!-- filled in by script.js -->
      </div>
      <div id="day-detail">
        <!-- filled in by script.js -->
      </div>
    </section>
