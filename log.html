<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Log a Set — Gym & Training Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <p class="eyebrow" id="countdown-text">Loading countdown...</p>
    <h1 class="wordmark">Gym &amp; Training Tracker</h1>
  </header>

  <main>

    <section id="log-section" class="card">
      <h2>Log a set</h2>
      <form id="log-form">
        <div class="field">
          <label for="exercise-name">Exercise</label>
          <input type="text" id="exercise-name" required>
        </div>

        <div class="field">
          <label>Type</label>
          <div class="type-toggle" id="log-type" role="group" aria-label="Exercise type" data-value="strength">
            <button type="button" class="type-toggle-btn is-active" data-type="strength" aria-pressed="true">
              <svg class="type-icon" viewBox="0 0 24 24"><rect x="1.5" y="8" width="3" height="8" rx="1.3" fill="currentColor"/><rect x="19.5" y="8" width="3" height="8" rx="1.3" fill="currentColor"/><rect x="5.5" y="9.5" width="2.5" height="5" rx="1" fill="currentColor"/><rect x="16" y="9.5" width="2.5" height="5" rx="1" fill="currentColor"/><rect x="7.5" y="10.8" width="9" height="2.4" rx="1.2" fill="currentColor"/></svg>
              <span>Strength</span>
            </button>
            <button type="button" class="type-toggle-btn" data-type="cardio" aria-pressed="false">
              <svg class="type-icon" viewBox="0 0 24 24"><path class="rt-limb" d="M15 6.2L11.3 12.6"/><path class="rt-limb" d="M11.3 12.6L15.2 10.8L17.3 15.8"/><path class="rt-limb" d="M11.3 12.6L7.2 13.6L4.7 18.3"/><path class="rt-limb" d="M13.4 7.6L17.6 6.3L20.2 8.8"/><path class="rt-limb" d="M13.4 7.6L9.3 9.1L6.8 7"/><circle class="rt-head" cx="16.3" cy="4" r="2"/><path class="rt-head" d="M15.3 2.8C13.5 0.5 10.8 -1 9.2 0.3C10.8 1.8 12.8 2.6 14.2 3.6Z"/></svg>
              <span>Cardio</span>
            </button>
          </div>
        </div>

        <div class="field-row" id="strength-fields">
          <div class="field">
            <label for="sets">Sets</label>
            <input type="number" id="sets" min="1">
          </div>
          <div class="field">
            <label for="reps">Reps</label>
            <input type="number" id="reps" min="1">
          </div>
          <div class="field">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" min="0" step="0.5">
          </div>
        </div>

        <div class="field-row" id="cardio-fields" hidden>
          <div class="field">
            <label for="distance">Distance (km)</label>
            <input type="number" id="distance" min="0" step="0.1">
          </div>
          <div class="field">
            <label for="duration">Duration (min)</label>
            <input type="number" id="duration" min="0">
          </div>
        </div>

        <button type="submit" class="btn-primary">Save entry</button>
      </form>
    </section>

  </main>

  <div class="tab-bar-wrap">
    <nav class="tab-bar" aria-label="Sections">
      <a href="index.html" class="tab-btn">
        <span class="tab-icon-wrap">
          <svg class="tab-icon" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg>
        </span>
        <span class="tab-label">Home</span>
      </a>
      <a href="log.html" class="tab-btn is-active" aria-current="page">
        <span class="tab-icon-wrap">
          <svg class="tab-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        </span>
        <span class="tab-label">Log</span>
      </a>
      <a href="timer.html" class="tab-btn">
        <span class="tab-icon-wrap">
          <svg class="tab-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        </span>
        <span class="tab-label">Timer</span>
      </a>
      <a href="plan.html" class="tab-btn">
        <span class="tab-icon-wrap">
          <svg class="tab-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
        </span>
        <span class="tab-label">Plan</span>
      </a>
      <a href="templates.html" class="tab-btn">
        <span class="tab-icon-wrap">
          <svg class="tab-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="4" rx="1"/><rect x="4" y="10" width="16" height="4" rx="1"/><rect x="4" y="16" width="16" height="4" rx="1"/></svg>
        </span>
        <span class="tab-label">Templates</span>
      </a>
      <a href="history.html" class="tab-btn">
        <span class="tab-icon-wrap">
          <svg class="tab-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
        </span>
        <span class="tab-label">History</span>
      </a>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
