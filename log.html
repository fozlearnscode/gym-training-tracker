<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Log a Set — Steph's Training Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Poppins:wght@300;400;500&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Home screen polish: a real icon + full-screen launch when added to the iOS home
       screen, instead of a generic bookmark icon inside Safari's browser chrome. -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-title" content="Training">

<body>

  <header class="site-header">
    <p class="eyebrow" id="countdown-text">Loading countdown...</p>
    <h1 class="wordmark">Steph's Training Tracker</h1>
  </header>

  <main>

    <section id="log-section" class="card">
      <h2>Log a set</h2>
      <form id="log-form">
        <div class="field">
          <label for="exercise-name">Exercise</label>
          <input type="text" id="exercise-name" required>
        </div>

        <div class="field">
          <label>Type</label>
          <div class="type-toggle" id="log-type" role="group" aria-label="Exercise type" data-value="strength">
            <button type="button" class="type-toggle-btn is-active" data-type="strength" aria-pressed="true">
              <svg class="type-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 5C10.89 5 10 5.89 10 7S10.89 9 12 9 14 8.11 14 7 13.11 5 12 5M22 1V6H20V4H4V6H2V1H4V3H20V1H22M15 11.26V23H13V18H11V23H9V11.26C6.93 10.17 5.5 8 5.5 5.5L5.5 5H7.5L7.5 5.5C7.5 8 9.5 10 12 10S16.5 8 16.5 5.5L16.5 5H18.5L18.5 5.5C18.5 8 17.07 10.17 15 11.26Z"/></svg>
              <span>Strength</span>
            </button>
            <button type="button" class="type-toggle-btn" data-type="cardio" aria-pressed="false">
              <svg class="type-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M13.5,5.5C14.59,5.5 15.5,4.58 15.5,3.5C15.5,2.38 14.59,1.5 13.5,1.5C12.39,1.5 11.5,2.38 11.5,3.5C11.5,4.58 12.39,5.5 13.5,5.5M9.89,19.38L10.89,15L13,17V23H15V15.5L12.89,13.5L13.5,10.5C14.79,12 16.79,13 19,13V11C17.09,11 15.5,10 14.69,8.58L13.69,7C13.29,6.38 12.69,6 12,6C11.69,6 11.5,6.08 11.19,6.08L6,8.28V13H8V9.58L9.79,8.88L8.19,17L3.29,16L2.89,18L9.89,19.38Z"/></svg>
              <span>Cardio</span>
            </button>
            <button type="button" class="type-toggle-btn" data-type="dance" aria-pressed="false">
              <!-- "human-female-dance", Material Design Icons (Pictogrammers), Apache-2.0: https://pictogrammers.com/library/mdi/icon/human-female-dance/ -->
              <svg class="type-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M17 17H15V23H13V17H10.88L9.34 18.93L11.71 21.29L10.29 22.71L7.93 20.34C7.58 20 7.38 19.53 7.35 19.04C7.32 18.55 7.47 18.06 7.78 17.68L8.32 17H7L9 13V10C8.38 10.47 7.88 11.07 7.53 11.76C7.18 12.46 7 13.22 7 14H5C5 12.14 5.74 10.36 7.05 9.05C8.36 7.74 10.14 7 12 7C13.33 7 14.6 6.47 15.54 5.54C16.47 4.6 17 3.33 17 2H19C19 3.32 18.62 4.62 17.91 5.73C17.2 6.85 16.2 7.74 15 8.31V13L17 17M14 4C14 4.4 13.88 4.78 13.66 5.11C13.44 5.44 13.13 5.7 12.77 5.85C12.4 6 12 6.04 11.61 5.96C11.22 5.88 10.87 5.69 10.59 5.41C10.31 5.13 10.12 4.78 10.04 4.39C9.96 4 10 3.6 10.15 3.24C10.3 2.87 10.56 2.56 10.89 2.34C11.22 2.12 11.6 2 12 2C12.53 2 13.04 2.21 13.41 2.59C13.79 2.96 14 3.47 14 4Z"/></svg>
              <span>Dance</span>
            </button>
          </div>
        </div>

        <div class="field-row" id="strength-fields">
          <div class="field">
            <label for="sets">Sets</label>
            <input type="number" id="sets" min="1">
          </div>
          <div class="field">
            <label for="reps">Reps</label>
            <input type="number" id="reps" min="1">
          </div>
          <div class="field">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" min="0" step="0.5">
          </div>
        </div>

        <div class="field-row" id="cardio-fields" hidden>
          <div class="field">
            <label for="distance">Distance (km)</label>
            <input type="number" id="distance" min="0" step="0.1">
          </div>
          <div class="field">
            <label for="duration">Duration (min)</label>
            <input type="number" id="duration" min="0">
          </div>
        </div>

        <div class="field-row" id="dance-fields" hidden>
          <div class="field">
            <label for="dance-duration">Duration (min)</label>
            <input type="number" id="dance-duration" min="0">
          </div>
          <div class="field">
            <label for="songs">Songs</label>
            <input type="number" id="songs" min="0">
          </div>
          <div class="field">
            <label for="effort">Effort</label>
            <select id="effort">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>
        </div>

        <p class="form-hint" id="log-pace-preview" hidden></p>

        <p class="form-success" id="log-pb-message" hidden></p>

        <button type="submit" class="btn-primary">Save entry</button>
      </form>
    </section>

  </main>

      <a href="history.html" class="tab-btn">

        </span>
        <span class="tab-label">History</span>

      <a href="videos.html" class="tab-btn">

        </span>

      <a href="suggest.html" class="tab-btn">

        </span>
        <span class="tab-label">Suggest</span>

      <a href="import.html" class="tab-btn">
